<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Request a free junk removal quote from Disposal Solutions of North Carolina."
    >

    <title>
        Get a Free Quote | Disposal Solutions of North Carolina
    </title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- HEADER -->

    <header class="site-header">

        <nav class="navbar container">

            <a
                href="index.html"
                class="logo"
                aria-label="Disposal Solutions of North Carolina Home"
            >

                <img
                    src="logo.jpg"
                    alt="Disposal Solutions of North Carolina logo"
                >

            </a>


            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="work.html">
                    Our Work
                </a>

                <a
                    href="quote.html"
                    class="nav-cta"
                >
                    Get a Quote
                </a>

            </div>

        </nav>

    </header>


    <main>

        <!-- QUOTE FORM -->

        <section class="quote-section">

            <div class="container">

                <div class="section-heading">

                    <p class="eyebrow">
                        Free Quote
                    </p>


                    <h1>
                        Tell Us What You Need Removed
                    </h1>


                    <p>

                        Fill out the form below and our team
                        will get back to you.

                    </p>

                </div>


                <form
                    id="quote-form"
                    class="quote-form"
                >

                    <!-- NAME -->

                    <div class="form-group">

                        <label for="name">
                            Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="phone">
                            Phone
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            autocomplete="tel"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                        >

                    </div>


                    <!-- JOB ADDRESS -->

                    <div class="form-group">

                        <label for="address">
                            Job Address
                        </label>

                        <input
                            type="text"
                            id="address"
                            name="address"
                            autocomplete="street-address"
                            required
                        >

                    </div>


                    <!-- SERVICE -->

                    <div class="form-group">

                        <label for="service">
                            What do you need removed?
                        </label>

                        <select
                            id="service"
                            name="service"
                            required
                        >

                            <option value="">
                                Select a service
                            </option>

                            <option value="household-junk">
                                Household Junk
                            </option>

                            <option value="furniture">
                                Furniture
                            </option>

                            <option value="appliances">
                                Appliances
                            </option>

                            <option value="garage-cleanout">
                                Garage Cleanout
                            </option>

                            <option value="construction-debris">
                                Construction Debris
                            </option>

                            <option value="property-cleanout">
                                Property Cleanout
                            </option>

                            <option value="other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- JOB DESCRIPTION -->

                    <div class="form-group">

                        <label for="description">
                            Tell us about the job
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            rows="6"
                            placeholder="Tell us what needs to be removed..."
                            required
                        ></textarea>

                    </div>


                    <!-- SERVICE DATE -->

                    <div class="form-group">

                        <label for="date">
                            Preferred Service Date
                        </label>

                        <input
                            type="date"
                            id="date"
                            name="date"
                        >

                    </div>


                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Request My Free Quote
                    </button>


                    <p
                        id="form-status"
                        aria-live="polite"
                    ></p>

                </form>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="site-footer">

        <div class="container">

            <p>
                &copy; 2026 Disposal Solutions of North Carolina.
                All rights reserved.
            </p>

        </div>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>

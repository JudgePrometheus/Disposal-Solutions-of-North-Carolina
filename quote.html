<section class="quote-section">
        <link rel="stylesheet" href="style.css">


    <div class="container">

        <div class="section-heading">

            <p class="eyebrow">
                Free Quote
            </p>

            <h1>
                Tell Us What You Need Removed
            </h1>

            <p>
                Fill out the form below and our team
                will get back to you.
            </p>

        </div>


        <form id="quote-form" class="quote-form">

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                >

            </div>


            <div class="form-group">

                <label for="address">
                    Job Address
                </label>

                <input
                    type="text"
                    id="address"
                    name="address"
                    required
                >

            </div>


            <div class="form-group">

                <label for="service">
                    What do you need removed?
                </label>

                <select
                    id="service"
                    name="service"
                    required
                >

                    <option value="">
                        Select a service
                    </option>

                    <option value="household">
                        Household Junk
                    </option>

                    <option value="furniture">
                        Furniture
                    </option>

                    <option value="appliances">
                        Appliances
                    </option>

                    <option value="garage">
                        Garage Cleanout
                    </option>

                    <option value="construction">
                        Construction Debris
                    </option>

                    <option value="property">
                        Property Cleanout
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="description">
                    Tell us about the job
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="6"
                    placeholder="Tell us what needs to be removed..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="date">
                    Preferred Service Date
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary"
            >
                Request My Free Quote
            </button>


            <p id="form-status"></p>

        </form>

    </div>

</section>
